{% extends "base.html" %}

{% block content %}

<h1 class="text-center my-5 h5">Czy oferta zakończyła się sprzedażą?</h1>

<div class="mx-auto" style="max-width: 400px;">
<p class="my-3">
    Oferta: <strong>{{ offer.car }}</strong>
</p>

<form method="post">
    {% csrf_token %}

        <div class="my-3">
            <label class="form-label mb-1">
                {{ form.if_sold.label_tag }}
            </label>
            {{ form.if_sold }}
        </div>

    <button type="submit" class="btn btn-primary w-100 mb-4 mt-3">
        Zakończ ofertę
    </button>
</form>
</div>

{% endblock %}
